services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: museflow
      POSTGRES_USER: museflow
      POSTGRES_PASSWORD: museflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museflow -d museflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - museflow-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - museflow-redis:/data

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - museflow-minio:/data

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY:-minioadmin}" "$${MINIO_SECRET_KEY:-minioadmin}"; do sleep 1; done;
        mc mb --ignore-existing local/$${MINIO_BUCKET:-museflow-results};
        mc anonymous set private local/$${MINIO_BUCKET:-museflow-results}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-museflow-results}

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["uv", "run", "--no-dev", "uvicorn", "museflow.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-museflow-results}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    build: ./backend
    command: ["uv", "run", "--no-dev", "python", "-m", "museflow.scheduler"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_INTERVAL_SECONDS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-m", "museflow.scheduler", "--check-ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: ["uv", "run", "--no-dev", "celery", "-A", "museflow.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-museflow-results}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-m", "museflow.worker", "--check-ready"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  museflow-postgres:
  museflow-redis:
  museflow-minio:
