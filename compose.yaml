services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: museflow
      POSTGRES_USER: museflow
      POSTGRES_PASSWORD: museflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museflow -d museflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - museflow-postgres:/var/lib/postgresql/data

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["uv", "run", "--no-dev", "uvicorn", "museflow.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MUSEFLOW_DATABASE_URL: postgresql+psycopg://museflow:museflow@postgres:5432/museflow
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  museflow-postgres:
