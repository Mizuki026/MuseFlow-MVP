[project]
name = "museflow-backend"
version = "0.1.0"
description = "MuseFlow MVP backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.116,<1",
    "minio>=7.2,<8",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/museflow"]
